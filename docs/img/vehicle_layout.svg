<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>SLR-1 vehicle layout (side view, nose left)</title>
  <rect width="980" height="470" fill="#fcfcfb"/>
  <!-- scale: 500 px per metre; nose tip at x = 100; body axis at y = 200; radius 25.4 px -->
  <text x="20" y="32" font-size="17" font-weight="bold" fill="#0b0b0b">SLR-1 layout: 60 in (1.52 m) long, 4.0 in (102 mm) diameter</text>
  <text x="20" y="54" font-size="12" fill="#52514e">Side view, nose left. Stations measured from the nose tip. Legs shown stowed (solid) and deployed (dashed).</text>

  <!-- station ruler -->
  <g font-size="10" fill="#898781" stroke="#c3c2b7" stroke-width="1">
    <line x1="100" y1="392" x2="862" y2="392"/>
    <line x1="100" y1="387" x2="100" y2="397"/><text x="100" y="410" text-anchor="middle" stroke="none">0</text>
    <line x1="200" y1="387" x2="200" y2="397"/><text x="200" y="410" text-anchor="middle" stroke="none">0.2</text>
    <line x1="300" y1="387" x2="300" y2="397"/><text x="300" y="410" text-anchor="middle" stroke="none">0.4</text>
    <line x1="400" y1="387" x2="400" y2="397"/><text x="400" y="410" text-anchor="middle" stroke="none">0.6</text>
    <line x1="500" y1="387" x2="500" y2="397"/><text x="500" y="410" text-anchor="middle" stroke="none">0.8</text>
    <line x1="600" y1="387" x2="600" y2="397"/><text x="600" y="410" text-anchor="middle" stroke="none">1.0</text>
    <line x1="700" y1="387" x2="700" y2="397"/><text x="700" y="410" text-anchor="middle" stroke="none">1.2</text>
    <line x1="800" y1="387" x2="800" y2="397"/><text x="800" y="410" text-anchor="middle" stroke="none">1.4</text>
    <line x1="862" y1="387" x2="862" y2="397"/><text x="868" y="410" text-anchor="middle" stroke="none">1.524 m</text>
  </g>

  <!-- deployed legs (dashed): hinge at 1.40 m (x=800), 0.60 m long, 55 deg from axis -->
  <g stroke="#1baf7a" stroke-width="3" stroke-dasharray="7 5" fill="none" stroke-linecap="round">
    <!-- drawn shortened into the canvas: direction (cos55, sin55) in body coords, aft = +x -->
    <line x1="800" y1="174.6" x2="910" y2="17"/>
    <line x1="800" y1="225.4" x2="910" y2="383"/>
  </g>
  <g fill="#1baf7a"><circle cx="910" cy="17" r="6"/><circle cx="910" cy="383" r="6"/></g>
  <text x="920" y="40" font-size="11" fill="#52514e">foot</text>

  <!-- body tube -->
  <rect x="262" y="174.6" width="600" height="50.8" fill="#eef2f7" stroke="#52514e" stroke-width="1.5"/>
  <!-- nose cone (ogive) -->
  <path d="M100,200 C150,176 210,174.6 262,174.6 L262,225.4 C210,225.4 150,224 100,200 Z" fill="#eef2f7" stroke="#52514e" stroke-width="1.5"/>
  <!-- drogue cup in the nose tip -->
  <rect x="112" y="193" width="42" height="14" rx="3" fill="#eb6834" opacity="0.85"/>
  <!-- main chute bay -->
  <rect x="270" y="179" width="105" height="42" rx="4" fill="#f6d9cc" stroke="#eb6834" stroke-width="1"/>
  <!-- avionics bay -->
  <rect x="440" y="179" width="75" height="42" rx="4" fill="#d6e6f8" stroke="#2a78d6" stroke-width="1"/>
  <line x1="440" y1="174.6" x2="440" y2="225.4" stroke="#52514e" stroke-width="2"/>
  <line x1="515" y1="174.6" x2="515" y2="225.4" stroke="#52514e" stroke-width="2"/>
  <!-- legs stowed (solid) -->
  <g stroke="#1baf7a" stroke-width="4" stroke-linecap="round">
    <line x1="800" y1="172" x2="500" y2="172"/>
    <line x1="800" y1="228" x2="500" y2="228"/>
  </g>
  <!-- motor bay: dual-motor gimbal with two 29 mm motors -->
  <rect x="790" y="181" width="62" height="16" rx="2" fill="#898781"/>
  <rect x="790" y="203" width="62" height="16" rx="2" fill="#52514e"/>
  <rect x="778" y="178" width="10" height="44" fill="#2a78d6"/>
  <!-- fins (top and bottom shown) -->
  <path d="M800,174.6 L812,136.6 L842,136.6 L862,174.6 Z" fill="#c3c2b7" stroke="#52514e" stroke-width="1"/>
  <path d="M800,225.4 L812,263.4 L842,263.4 L862,225.4 Z" fill="#c3c2b7" stroke="#52514e" stroke-width="1"/>
  <!-- exhaust paddles -->
  <path d="M864,190 L880,196 L880,198 L864,193 Z" fill="#e34948"/>
  <path d="M864,210 L880,204 L880,202 L864,207 Z" fill="#e34948"/>
  <!-- lidar -->
  <rect x="852" y="222" width="10" height="6" fill="#6250d6"/>

  <!-- CG / CP markers -->
  <g>
    <circle cx="614.5" cy="200" r="7" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
    <path d="M614.5,193 A7,7 0 0 1 621.5,200 L614.5,200 Z M614.5,207 A7,7 0 0 1 607.5,200 L614.5,200 Z" fill="#0b0b0b"/>
    <text x="614" y="250" font-size="11" text-anchor="middle" fill="#0b0b0b">CG 1.03 m (liftoff)</text>
    <circle cx="646" cy="200" r="5" fill="#e34948"/>
    <text x="660" y="270" font-size="11" text-anchor="middle" fill="#0b0b0b">CP 1.09 m (nose-first, +0.6 cal)</text>
  </g>

  <!-- callouts -->
  <g font-size="11.5" fill="#0b0b0b">
    <line x1="133" y1="193" x2="133" y2="96" stroke="#898781"/>
    <text x="40" y="78">Drogue (9 in) in spring cup:</text>
    <text x="40" y="92" fill="#52514e">deploys at apogee, cut at touchdown</text>
    <line x1="322" y1="179" x2="322" y2="110" stroke="#898781"/>
    <text x="270" y="100">Backup main chute (30 in)</text>
    <line x1="477" y1="179" x2="477" y2="128" stroke="#898781"/>
    <text x="420" y="118">Avionics bay: Teensy 4.1,</text>
    <text x="420" y="132" fill="#52514e" dy="-0">BMI088, BMP390, GPS, LoRa</text>
    <line x1="650" y1="172" x2="650" y2="150" stroke="#898781"/>
    <text x="560" y="146">Legs stowed (4 x 0.60 m CF tube)</text>
    <line x1="783" y1="222" x2="700" y2="300" stroke="#898781"/>
    <text x="470" y="316">2-axis TVC gimbal, 2 x AeroTech G40W</text>
    <text x="470" y="330" fill="#52514e">(ascent + landing motor side by side)</text>
    <line x1="872" y1="200" x2="940" y2="200" stroke="#898781"/>
    <text x="898" y="226">Exhaust</text>
    <text x="898" y="240">paddles</text>
    <text x="898" y="254" fill="#52514e">(throttle)</text>
    <line x1="857" y1="228" x2="800" y2="352" stroke="#898781"/>
    <text x="700" y="366" fill="#52514e">Lidar (TFmini-S) looks down</text>
    <text x="760" y="130" fill="#52514e">4 fins</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#52514e">
    <rect x="20" y="430" width="14" height="10" fill="#d6e6f8" stroke="#2a78d6"/><text x="40" y="439">electronics</text>
    <rect x="130" y="430" width="14" height="10" fill="#f6d9cc" stroke="#eb6834"/><text x="150" y="439">recovery</text>
    <line x1="230" y1="435" x2="250" y2="435" stroke="#1baf7a" stroke-width="4"/><text x="256" y="439">legs (stowed / deployed - footprint 1.08 m tip-to-tip)</text>
    <rect x="610" y="430" width="14" height="10" fill="#52514e"/><text x="630" y="439">motors</text>
    <rect x="690" y="430" width="14" height="10" fill="#e34948"/><text x="710" y="439">paddles</text>
  </g>
</svg>
