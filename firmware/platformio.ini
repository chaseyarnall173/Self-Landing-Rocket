; SLR-1 flight computer
;   pio run -e teensy41            build
;   pio run -e teensy41 -t upload  flash over USB
;   make -C firmware test          native unit + SIL tests (no PlatformIO needed)

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -std=gnu++17 -O2 -Wall
build_unflags = -std=gnu++14
lib_deps =
    sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.27
monitor_speed = 115200
